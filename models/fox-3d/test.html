<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#383043}canvas{display:block}</style></head><body>
<canvas id="c" width="700" height="900"></canvas>
<script src="node_modules/three/build/three.min.js"></script>
<script src="out/palette.js"></script>
<script src="viewer/stage.js"></script>
<script src="out/fox_tex.js"></script>
<script src="out/fox.js"></script>
<script>
window.T = {}; var T = window.T;
try {
  T.stage = makeStage(document.getElementById('c'), { preserve: true, shadow: 2048 });
  const t0 = performance.now();
  const QS = new URLSearchParams(location.search), OPTS = QS.get('o') ? JSON.parse(QS.get('o')) : {};
  if (QS.get('nohands') && window.FOX_TEX) delete window.FOX_TEX.hands;
  T.j = makeFox(OPTS);
  T.buildMs = performance.now() - t0;
  T.stage.scene.add(T.j.root); if (T.j.fx) T.stage.scene.add(T.j.fx);
  T.time = 0; T.phase = 0; T.wb = 0; T.rb = 0;
  T.step = (n, dt) => { for (let i = 0; i < n; i++) { T.time += dt; if (T.wb > 0) T.phase += dt * (4.9 + 4.1 * T.rb); T.j.animate(T.phase, T.wb, T.time, dt, T.rb); T.j.root.rotation.y = (T.yaw || 0) + T.j.spin; } };
  T.st = (name, time) => { T.j.setStance(name); T.step(Math.round(time * 60), 1/60); return T.j.stanceProgress; };
  T.ph = (ph, wb, rb, n) => { T.wb = wb; T.rb = rb; const sp = 4.9 + 4.1 * rb; T.phase = ph - (n || 90) * sp / 60; T.step(n || 90, 1/60); return T.phase; };
  T.view = (az, el, dist, ty, fov, w, h) => { const o = T.stage.orbit, cam = T.stage.camera; cam.near = Math.max(0.1, dist - 4); cam.far = Math.max(60, dist + 6);   /* the stage's camera sees 60 m and no further: from 60 m away that cut off everything behind her middle */ o.az = az; o.el = el; o.dist = dist; o.target.y = ty; if (fov) o.fov = fov; T.stage.resize(w || 700, h || 900, 1); T.stage.render(); return T.stage.renderer.info.render.triangles; };
  T.at = (name, time) => { T.j.play(name, true); const n = Math.round(time * 60); for (let i = 0; i < n; i++) { T.time += 1/60; T.j.animate(T.phase, T.wb, T.time, 1/60, T.rb); T.j.root.rotation.y = (T.yaw || 0) + T.j.spin; } return T.j.time; };
  T.clean = (mode) => { const s = T.stage; s.noFloor = true; s.floor.visible = false; s.shadowCatcher.visible = false; s.bg = new THREE.Color(mode === 'mask' ? 0x00ff00 : 0x383043); };
  T.bare = () => { T.j.debug.cloths.forEach((c) => { if (c.outer || (c.meshes[0] && c.meshes[0].material.transparent)) c.meshes.forEach((m) => { m.visible = false; }); }); };
  T.only = (keys) => { T.j.root.traverse((o) => { if (o.isMesh) o.visible = false; }); T.j.debug.cloths.forEach((c) => c.meshes.forEach((m) => { m.visible = false; })); const M = T.j.debug.meshes; keys.forEach((k) => { if (M[k]) M[k].visible = true; }); return Object.keys(M); };
  T.flat = () => { const SK = T.j.debug.SK; for (const k in SK) if (/^(idx|mid|rng|pnk|thb)\d[LR]$/.test(k)) SK[k].quaternion.identity(); T.j.root.updateMatrixWorld(true); };
  T.hv = (S, x, y, z) => { const sgn = S === 'L' ? 1 : -1, A = 15 * Math.PI / 180, c = Math.cos(sgn * A), sn = Math.sin(sgn * A), mx = -sgn * x; const d = new THREE.Vector3(mx * c - y * sn, mx * sn + y * c, z).normalize(); const q = new THREE.Quaternion(); T.j.debug.SK['hand' + S].getWorldQuaternion(q); d.applyQuaternion(q); const o = T.stage.orbit; o.el = Math.asin(d.y); o.az = Math.atan2(d.x, d.z); const v = new THREE.Vector3(), w = new THREE.Vector3(); T.j.debug.SK['hand' + S].getWorldPosition(v); T.j.debug.SK['mid1' + S].getWorldPosition(w); v.lerp(w, 0.62); o.target.x = v.x; o.target.z = v.z; T.hvY = v.y; return [o.az, o.el, v.y]; };
  T.shot = (dist, fov, w, h) => { const o = T.stage.orbit; o.dist = dist; o.target.y = T.hvY; o.fov = fov; T.stage.resize(w, h, 1); T.stage.render(); };
  T.face = (az, el, dist, w, h, dy) => { const o = T.stage.orbit, v = new THREE.Vector3(0, 1.488 + (dy || 0), 0.055), hb = T.j.debug.SK.head, sk = T.j.skeleton; v.applyMatrix4(new THREE.Matrix4().multiplyMatrices(hb.matrixWorld, sk.boneInverses[sk.bones.indexOf(hb)])); o.az = az; o.el = el; o.dist = dist; o.target.copy(v); o.fov = 22; T.stage.resize(w || 620, h || 620, 1); T.stage.render(); };
  T.aim = (bone, bone2) => { const v = new THREE.Vector3(), w = new THREE.Vector3(); T.j.debug.SK[bone].getWorldPosition(v); if (bone2) { T.j.debug.SK[bone2].getWorldPosition(w); v.add(w).multiplyScalar(0.5); } T.stage.orbit.target.x = v.x; T.stage.orbit.target.z = v.z; return [v.x, v.y, v.z]; };
  T.ok = true;
} catch (e) { T.err = String(e.stack || e); console.error(T.err); }
</script></body></html>
