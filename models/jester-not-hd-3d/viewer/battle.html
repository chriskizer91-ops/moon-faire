// ------------------------------------------------------------------ the picture

const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 140);
const { R, flies, setLight } = buildSquare(scene);
const decor = o => { o.traverse(x => x.layers.set(DECOR)); return o; };

// ------------------------------------------------------------------ the game clock, and scripts that wait on it

// ------------------------------------------------------------------ the fighters

  SealedFate:     { rate: 1.5, hits: [1.0], free: 1.35 },
  Hush:           { rate: 1.8, hits: [0.95], free: 1.3 },

// ------------------------------------------------------------------ the camera
// One pulled-back view that holds the whole field the whole time. It leans a little toward whoever is acting,
// and dragging the picture turns it.
const cam = { pos: v3(0, 3, 9), look: v3(0, 1.2, 0), shot: null, rate: 3, shake: 0, orbit: 0, tilt: 0, lean: null, leanP: v3(0, 1, 0), push: 0, pushT: 0 };

function inside(pos, look) {                      // keep the camera in front of the lantern posts and bunting

// ------------------------------------------------------------------ loading, sizes, controls

// ------------------------------------------------------------------ one frame

    if (W.target) { const dx = W.target.x - W.x, dz = W.target.z - W.z, d = Math.hypot(dx, dz), stepD = W.speed * dt; W.tyaw = d > 0.05 ? Math.atan2(dx, dz) : W.tyaw; if (d <= stepD + 1e-4) { W.x = W.target.x; W.z = W.target.z; W.target = null; W.tyaw = faceYaw(W, centre()); } else { W.x += dx / d * stepD; W.z += dz / d * stepD; } }
    W.v += ((W.target ? W.speed : 0) - W.v) * Math.min(1, dt * 8);

    W.yaw += wrap(W.tyaw - W.yaw) * Math.min(1, dt * 7);

      const d = dooms.find(o => o.A === A), pull = d ? cl((clock.t - d.t0 - 0.3) / 0.7) : 0;     // Doom's black hole draws it up and in
      m.root.position.set(A.x, 0.5 * pull * pull, A.z); m.root.rotation.y = A.yaw; m.root.scale.setScalar(1 - 0.3 * pull * pull);
      m.animate(A.phase, A.moving, clock.t, dt);

      A.blob.visible = !A.gone; A.blob.position.x = A.x; A.blob.position.z = A.z; A.blob.material.opacity = 0.5 * (A.dying ? 1 - cl(m.progress * 1.5) : m.fade === undefined ? 1 : 1); A.blob.scale.setScalar(1 - 0.3 * cl(m.lift || 0));

    for (let i = dooms.length - 1; i >= 0; i--) { const d = dooms[i], o = fx.extra('DoomLands', d.A.i, clock.t - d.t0, { top: d.top, target: d.target, ground: d.ground }); spellDim = Math.max(spellDim, o.dim); shake = Math.max(shake, o.shake); if (clock.t - d.t0 > 2.4) dooms.splice(i, 1); }
    if (S && B.state !== 'boot') for (const A of foes) if (A.f.doom > 0 && A.f.hp > 0 && !dooms.some(o => o.A === A)) fx.extra('DoomMark', A.i, T, { pos: markPos(A), count: A.f.doom });

        if (B.aim === A && UI.choosing) F.hoop('aim' + A.i, v3(A.x, 0.05, A.z), Q0, 2.3 + 0.1 * Math.sin(T * 5), T * 0.8, 1, 1, u.GOLD, 2.2);

}

// hooks for automated checks
const api = window.J = {

  // choose a command, and a wraith by number if it needs one

  },
  look() { return { state: B.state, level: B.level, choosing: UI.choosing, menu: UI.items.map(i => i.id + (i.disabled ? '!' : '')), over: S && S.over, hero: S && { ...S.hero }, foes: S ? S.foes.map((f, i) => ({ ...f, last: undefined, action: foes[i] && foes[i].m.action, gone: foes[i] && foes[i].gone })) : [], time: clock.t - B.t0, casts: casts.length, tasks: tasks.length, sparks: sparks.length }; },
