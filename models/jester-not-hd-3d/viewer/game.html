      });

      for (let i = fires.length - 1; i >= 0; i--) { const f = fires[i]; f.t += dt; const o = new THREE.Vector3(f.x + Math.sin(f.yaw) * 4.5, 1.3, f.z + Math.cos(f.yaw) * 4.5); F.motes('fire' + (i % 2), o, 900, f.t, { emit: 0.25, life: 0.7, spread: 5.5, rise: 0.6, size: 0.12, color: 0xff8a30, flatten: 0.35 }); F.glow('fg' + (i % 2), 3, o, 6 * u.ramp(f.t, 0, 0.2), u.win(f.t, 0, 0.05, 0.2, 0.7), 0xff9a40, 2.4); F.light(o, 0xff9a40, 12 * u.win(f.t, 0, 0.05, 0.2, 0.7)); if (f.t > 1) fires.splice(i, 1); }
      if (me.shield > 0) F.shell('ward', new THREE.Vector3(me.x, 1.0, me.z), 1.25, 0.7, u.GOLD, 1.6, 3.0);
    });
    for (let i = pops.length - 1; i >= 0; i--) { const p = pops[i]; p.t += dt; p.s.position.y += dt * 0.9; p.s.material.opacity = 1 - cl((p.t - 0.6) / 0.5); if (p.t > 1.1) { scene.remove(p.s); p.s.material.map.dispose(); p.s.material.dispose(); pops.splice(i, 1); } }
    for (const f of foes) f.draw(cam.yaw);
    // the camera follows her, keeps what she is fighting in view, and steps back for the big spells
    const wide = lock ? WIDE[lock.name] || 0 : 0, at = new THREE.Vector3(me.x, 1.25, me.z);
    if (target && !target.dead) at.lerp(new THREE.Vector3(target.x, 1.25, target.z), 0.22);
    cam.focus.lerp(at, Math.min(1, dt * 4)); cam.d += (cam.dist + wide - cam.d) * Math.min(1, dt * 2.5);
    cam.shake = Math.max(0, cam.shake - dt * 2.5); shake = Math.max(shake, cam.shake);
    if (!skipDraw) hud();
  }
  setLight(false, dim);
  const cp = Math.cos(cam.pitch);
  camera.position.set(cam.focus.x + cam.d * Math.sin(cam.yaw) * cp, Math.max(0.3, cam.focus.y + cam.d * Math.sin(cam.pitch)), cam.focus.z + cam.d * Math.cos(cam.yaw) * cp);
  if (shake > 0 && !TEST) camera.position.add(new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(0.16 * shake));
  { // keep the camera inside the square, in front of the lantern posts and bunting
    const lim = R - 1.5, p = camera.position, f = cam.focus;
    if (Math.hypot(p.x, p.z) > lim) { let lo = 0, hi = 1; for (let i = 0; i < 12; i++) { const m = (lo + hi) / 2; if (Math.hypot(f.x + (p.x - f.x) * m, f.z + (p.z - f.z) * m) > lim) hi = m; else lo = m; } p.set(f.x + (p.x - f.x) * lo, f.y + (p.y - f.y) * Math.max(lo, 0.35), f.z + (p.z - f.z) * lo); }
  }
  camera.lookAt(cam.focus);
  if (!skipDraw) pipe.render(camera, state.pixel, 1 - (1 - 0.97 * dim) ** 2);   // squared, because the eye reads a tenth of the light as a third
}
renderer.setAnimationLoop(() => { if (!TEST) frame(); });

// hooks for automated checks
const api = window.J = {
  ready: false, state, me, stick, cam, frame, begin, cast: tryCast,
  run(seconds, dt = 1 / 30, draw = true) { for (let t = 0; t < seconds - 1e-6; t += dt) frame(dt, true); if (draw) frame(0); },
  look() { return { mode: state.mode, wave: state.wave, time: state.time, hp: me.hp, mp: me.mp, curtain: me.curtain, usedUlt: me.usedUlt, locked: !!lock, released, cds: { ...me.cds },
    tally, target: target && !target.dead ? foes.indexOf(target) : -1, foes: foes.map(f => ({ kind: f.kind, hp: f.hp, state: f.state, dead: !!f.dead, doom: f.doom, x: f.x, z: f.z, dist: f.dist() })), x: me.x, z: me.z }; },
  skip() { for (const f of foes) if (!f.dead) f.release(); },
  errors: () => errBox.textContent,
};
</script>
