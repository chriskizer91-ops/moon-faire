<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jester Witch: not-HD 3D model</title>
<style>
  :root { --bg:#2b2634; --panel:rgba(24,20,30,.86); --line:#5b4f6b; --ink:#efe6f2; --dim:#a99db5; --gold:#e2b04a; --wine:#8d2f4e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  #top { position:fixed; left:0; right:0; top:0; padding:10px 12px; display:flex; gap:8px; align-items:center; pointer-events:none; }
  #top h1 { font-size:15px; font-weight:600; margin:0; letter-spacing:.02em; white-space:nowrap; }
  #top .note { color:var(--dim); font-size:12px; margin-left:auto; text-align:right; }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:6px 0 calc(6px + env(safe-area-inset-bottom)) 8px; background:var(--panel); border-top:1px solid var(--line); backdrop-filter:blur(6px); }
  .row { display:flex; gap:6px; padding:3px 8px 3px 2px; overflow-x:auto; scrollbar-width:none; -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent); }
  .row::-webkit-scrollbar { display:none; }
  .row::after { content:""; flex:none; width:20px; }
  .lab { flex:none; align-self:center; color:var(--dim); font-size:11px; width:40px; text-transform:uppercase; letter-spacing:.06em; }
  button { flex:none; font:inherit; color:var(--ink); background:#3a3246; border:1px solid var(--line); border-radius:999px; padding:7px 12px; min-height:34px; cursor:pointer; white-space:nowrap; }
  button.on { background:var(--wine); border-color:var(--gold); color:#fff; }
  #fade { flex:none; width:120px; accent-color:var(--gold); }
  #load { position:fixed; inset:0; display:grid; place-items:center; color:var(--dim); background:var(--bg); }
  #err { position:fixed; left:8px; right:8px; top:44px; color:#ffb4a8; font-size:12px; white-space:pre-wrap; pointer-events:none; }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/build/three.module.min.js", "three/addons/": "./lib/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage"></div>
<div id="top"><h1>Jester Witch &middot; not-HD 3D</h1><div class="note" id="note">step 6: finer detail, grander spells</div></div>
<div id="err"></div>
<div id="bar">
  <div class="row" id="moves"><span class="lab">Move</span></div>
  <div class="row" id="spells"><span class="lab">Spell</span></div>
  <div class="row" id="views"><span class="lab">View</span>
    <button data-view="free" class="on">Free</button><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="back">Back</button>
    <button id="bTurn">Turntable</button><button id="bRoam">Walk about</button>
  </div>
  <div class="row"><span class="lab">Show</span>
    <button id="bPixel">Pixel finish</button><button id="bVeil" class="on">Veil</button><button id="bBones">Skeleton</button><button id="bSheet">Your drawing</button>
    <input id="fade" type="range" min="0" max="100" value="50" aria-label="How strongly the drawing shows">
  </div>
</div>
<div id="load">Loading the Jester&hellip;</div>
<script>
setTimeout(function () { var l = document.getElementById('load'); if (l) l.textContent = 'Still loading. If this stays, the 3D library or the model did not arrive: tell Claude.'; }, 25000);
</script>
<script src="jester_glb_a.js"></script>
<script src="jester_glb_b.js"></script>
<script src="jester_glb_c.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { makePipeline, HER, DECOR } from './pipeline.js';
import { loadJester, makeContext, makeBlink } from './core.js';
import { makeFx } from './fx.js';

const $ = s => document.querySelector(s);
const errBox = $('#err');
window.addEventListener('error', e => { errBox.textContent += (e.message || e) + '\n'; });
window.addEventListener('unhandledrejection', e => { errBox.textContent += (e.reason && e.reason.message || e.reason) + '\n'; });

const TEST = location.hash === '#test';
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: TEST });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.autoClear = false;
stage.appendChild(renderer.domElement);
const pixelRatio = Math.min(devicePixelRatio || 1, 2);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2634);
const persp = new THREE.PerspectiveCamera(32, 1, 0.05, 80);
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 80);
let camera = persp;
const controls = new OrbitControls(persp, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 0.6; controls.maxDistance = 18; controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 0.88, 0);
persp.position.set(1.5, 1.25, 4.4);

const hemi = new THREE.HemisphereLight(0xd9d2ff, 0x3a2c3a, 1.25);
const key = new THREE.DirectionalLight(0xfff1dc, 2.1); key.position.set(1.6, 3.2, 2.6);
const rim = new THREE.DirectionalLight(0xb78cff, 1.1); rim.position.set(-2.2, 2.0, -2.6);
for (const l of [hemi, key, rim]) { l.layers.enableAll(); scene.add(l); }
let dim = 0;
function light(flat) {                    // flat white light for the pixel finish, so colours land on her palette
  const k = 1 - 0.7 * dim;
  hemi.color.set(flat ? 0xffffff : 0xd9d2ff); hemi.groundColor.set(flat ? 0xb8b0b8 : 0x3a2c3a); hemi.intensity = (flat ? 2.3 : 1.25) * (flat ? 1 - 0.35 * dim : k);
  key.color.set(flat ? 0xffffff : 0xfff1dc); key.intensity = (flat ? 1.15 : 2.1) * (flat ? 1 - 0.35 * dim : k);
  rim.intensity = flat ? 0 : 1.1;
}

{
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#352e40'; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = 'rgba(226,176,74,.22)'; g.lineWidth = 2;
  for (let r = 32; r < 256; r += 32) { g.beginPath(); g.arc(256, 256, r, 0, 7); g.stroke(); }
  for (let a = 0; a < 12; a++) { g.beginPath(); g.moveTo(256, 256); g.lineTo(256 + 256 * Math.cos(a * Math.PI / 6), 256 + 256 * Math.sin(a * Math.PI / 6)); g.stroke(); }
  const grd = g.createRadialGradient(256, 256, 120, 256, 256, 256); grd.addColorStop(0, 'rgba(43,38,52,0)'); grd.addColorStop(1, 'rgba(43,38,52,1)');
  g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.CircleGeometry(8, 64), new THREE.MeshLambertMaterial({ map: t }));
  m.rotation.x = -Math.PI / 2; scene.add(m);
}
const blob = new THREE.Mesh(new THREE.CircleGeometry(0.34, 32), new THREE.MeshBasicMaterial({ color: 0x120e16, transparent: true, opacity: 0.45, depthWrite: false }));
blob.rotation.x = -Math.PI / 2; blob.position.y = 0.003; blob.layers.set(DECOR); scene.add(blob);

// Chris's drawing as a flat card, for checking proportions in the straight-on views
const SHEET = { ppm: 961 / 1.722, ground: 983.5, front: { file: 'ref/A1_front.png', x0: 100, w: 670, cx: 447.5 }, back: { file: 'ref/A1_back.png', x0: 770, w: 670, cx: 1088 } };
const cards = {};
function makeCard(which) {
  const s = SHEET[which];
  const tex = new THREE.TextureLoader().load(s.file); tex.colorSpace = THREE.SRGBColorSpace; tex.magFilter = THREE.NearestFilter;
  const W = s.w / SHEET.ppm, H = 1024 / SHEET.ppm;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.5, depthTest: false, depthWrite: false });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(W, H), mat);
  const left = (s.x0 - s.cx) / SHEET.ppm;
  m.position.set((left + W / 2) * (which === 'front' ? 1 : -1), SHEET.ground / SHEET.ppm - H / 2, which === 'front' ? 1.2 : -1.2);
  if (which === 'back') m.rotation.y = Math.PI;
  m.renderOrder = 10; m.visible = false; m.layers.set(DECOR); scene.add(m); cards[which] = m;
}
makeCard('front'); makeCard('back');

const fx = makeFx(scene);
const pipe = makePipeline(renderer, scene, { flatLight: light, onViewport: h => { fx.uH.value = h; } });

let J = null, ctx = null, blink = null, action, skel, current = 'Stand';
const state = { view: 'free', bones: false, sheet: false, turn: false, roam: false, veil: true, pixel: false, fade: 0.5, paused: false };
let roamT = 0;

loadJester(scene).then(j => {
  J = j; ctx = makeContext(J); ctx.prime(); blink = makeBlink(J.lids);
  pipe.setPalette(J.palette);
  skel = new THREE.SkeletonHelper(J.root); skel.visible = false; skel.material.depthTest = false; skel.renderOrder = 20; skel.layers.set(DECOR); scene.add(skel);
  for (const name of ['Stand', ...Object.keys(J.clips)]) {
    const b = document.createElement('button'); b.textContent = (J.info[name] && J.info[name].label) || name; b.dataset.move = name;
    b.onclick = () => play(name); (J.info[name] && J.info[name].spell ? $('#spells') : $('#moves')).appendChild(b);
  }
  play(J.clips.Idle ? 'Idle' : 'Stand');
  $('#load').remove();
  $('#note').textContent = `step 6: finer detail, grander spells · ${Math.round(J.tris / 1000)}k triangles`;
  resize();
  api.ready = true;
}).catch(e => { errBox.textContent += 'Could not load the model: ' + (e.message || e) + '\n'; });

function play(name, opts = {}) {
  current = name;
  document.querySelectorAll('#moves button, #spells button').forEach(b => b.classList.toggle('on', b.dataset.move === name));
  if (action) { action.fadeOut(opts.instant ? 0 : 0.25); }
  if (name === 'Stand' || !J.clips[name]) { action = null; if (opts.instant) J.mixer.stopAllAction(); return; }
  const a = J.mixer.clipAction(J.clips[name]);
  a.reset(); a.setLoop(THREE.LoopRepeat, Infinity); a.clampWhenFinished = true;
  if (opts.instant) { J.mixer.stopAllAction(); a.reset(); a.setEffectiveWeight(1); a.play(); } else a.fadeIn(0.25).play();
  action = a;
  if (J.info[name] && J.info[name].spell && state.view === 'free' && !TEST && persp.position.distanceTo(controls.target) < 6.5) {   // step back so the whole spell is in view
    const d = persp.position.clone().sub(controls.target).setLength(8.5); persp.position.copy(controls.target).add(d); controls.target.y = 1.3;
  }
}

function setView(v) {
  state.view = v;
  document.querySelectorAll('#views button[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  camera = v === 'free' ? persp : ortho;
  controls.enabled = v === 'free';
  const d = 6;
  if (v === 'front') ortho.position.set(0, 0.86, d);
  if (v === 'back') ortho.position.set(0, 0.86, -d);
  if (v === 'side') ortho.position.set(d, 0.86, 0);
  if (v !== 'free') { ortho.lookAt(v === 'side' ? 0 : ortho.position.x, 0.86, 0); if (state.roam) toggle('roam', false); }
  syncCards(); resize();
}
function syncCards() {
  cards.front.visible = state.sheet && state.view === 'front';
  cards.back.visible = state.sheet && state.view === 'back';
  cards.front.material.opacity = cards.back.material.opacity = state.fade;
}
function toggle(k, v) {
  state[k] = v === undefined ? !state[k] : v;
  for (const [id, key] of [['#bBones', 'bones'], ['#bSheet', 'sheet'], ['#bTurn', 'turn'], ['#bRoam', 'roam'], ['#bVeil', 'veil'], ['#bPixel', 'pixel']]) $(id).classList.toggle('on', state[key]);
  if (J && J.veil) J.veil.visible = state.veil;
  if (skel) skel.visible = state.bones;
  if (k === 'sheet' && state.sheet && state.view !== 'front' && state.view !== 'back') setView('front');
  if (k === 'roam') {
    if (state.roam) { if (state.view !== 'free') setView('free'); if (!(J.info[current] && J.info[current].speed)) play('Walk'); roamT = 0; }
    else if (J) { J.root.position.set(0, 0, 0); J.root.rotation.y = 0; }
  }
  syncCards();
}
document.querySelectorAll('#views button[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
$('#bBones').onclick = () => toggle('bones'); $('#bSheet').onclick = () => toggle('sheet'); $('#bVeil').onclick = () => toggle('veil'); $('#bPixel').onclick = () => toggle('pixel');
$('#bTurn').onclick = () => toggle('turn'); $('#bRoam').onclick = () => toggle('roam');
$('#fade').oninput = e => { state.fade = e.target.value / 100; syncCards(); };

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setPixelRatio(pixelRatio); renderer.setSize(w, h, false);
  pipe.setSize(w, h, pixelRatio);
  const bar = $('#bar').offsetHeight || 0;
  persp.aspect = w / h; persp.fov = w < h ? 40 : 32;
  persp.setViewOffset(w, h, 0, Math.round(bar * 0.45), w, h);      // lift the picture clear of the button bar
  persp.updateProjectionMatrix();
  const span = 2.02, usable = Math.max(120, h - bar - 40);
  const mpp = Math.max(span / usable, 1.25 / w);          // metres per screen pixel
  const cy = 0.86 - (bar - 40) / 2 * mpp;                  // keep her clear of the button bar
  ortho.left = -w / 2 * mpp; ortho.right = w / 2 * mpp; ortho.top = h / 2 * mpp + (cy - 0.86); ortho.bottom = -h / 2 * mpp + (cy - 0.86);
  ortho.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
new ResizeObserver(resize).observe($('#bar'));

const clock = new THREE.Clock();
function frame(dtOverride) {
  const dt = dtOverride !== undefined ? dtOverride : Math.min(clock.getDelta(), 0.05);
  dim = 0;
  if (J) {
    if (!state.paused) J.mixer.update(dt);
    if (!TEST) blink(dt);
    const root = J.root;
    if (state.roam) {
      const sp = (J.info[current] && J.info[current].speed) || 0;
      roamT += dt * sp;
      const a = 0.9, b = 2.2, th = roamT / ((a + b) / 2);   // a long oval so she walks toward the camera, turns, and walks away
      root.position.set(a * Math.sin(th), 0, b * Math.cos(th));
      root.rotation.y = Math.atan2(a * Math.cos(th), -b * Math.sin(th));
    } else if (state.turn) root.rotation.y += dt * 0.7;
    blob.position.x = root.position.x; blob.position.z = root.position.z;
    root.updateMatrixWorld(true);
    fx.F.begin(camera);
    if (action && fx.SPELLS[current] && J.info[current] && J.info[current].spell) {
      const c = ctx(current, action, null);
      fx.SPELLS[current](action.time, c);
      dim = c.out.dim;
    }
  }
  light(false);
  if (state.view === 'free') controls.update();
  pipe.render(camera, state.pixel);
}
renderer.setAnimationLoop(() => { if (!TEST) frame(); });

// hooks for automated checks
const api = window.J = {
  ready: false, state, play, setView, toggle, frame,
  pose(name, t) { play(name, { instant: true }); if (action) { action.time = t; action.paused = true; } J.mixer.update(0); state.paused = true; frame(0); },
  cam(px, py, pz, tx, ty, tz) { setView('free'); persp.position.set(px, py, pz); controls.target.set(tx, ty, tz); controls.update(); frame(0); },
  blink: on => { if (J.lids) J.lids.visible = on; },
  clipNames: () => Object.keys(J.clips), dur: n => J.clips[n].duration, errors: () => errBox.textContent,
};
</script>
</body>
</html>
