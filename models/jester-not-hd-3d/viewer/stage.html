}
const pipe = makePipeline(renderer, scene, { flatLight: light, onViewport: h => { fx.uH.value = h; } });
const blob = decor(new THREE.Mesh(new THREE.CircleGeometry(0.36, 32), new THREE.MeshBasicMaterial({ color: 0x06040a, transparent: true, opacity: 0.5, depthWrite: false })));
blob.rotation.x = -Math.PI / 2; blob.position.y = 0.012; scene.add(blob);

let J = null, ctx = null, blink = null, loco = null, casting = null;
const state = { pixel: false, veil: true };
const me = { x: 0, z: -0.6, yaw: 0, v: 0 };
const cam = { yaw: Math.PI, pitch: 0.2, dist: 5.6, focus: new THREE.Vector3(0, 1.2, 0), d: 5.6, shake: 0 };
const stick = { x: 0, y: 0 }, keys = {};
const WIDE = { CurtainCall: 4.2, AgainstAllOdds: 3.0, SealedFate: 1.6, GildedRebuke: 1.4, Hush: 1.4, Gravity: 1.8 };

loadJester(scene).then(j => {
  J = j; ctx = makeContext(J); ctx.prime(); blink = makeBlink(J.lids);
  pipe.setPalette(J.palette);
  const act = n => { const a = J.mixer.clipAction(J.clips[n]); a.setLoop(THREE.LoopRepeat, Infinity); a.setEffectiveWeight(0); a.play(); return a; };
  loco = { idle: act('Idle'), walk: act('Walk'), run: act('Run') };
  for (const name of Object.keys(J.clips)) {
    if (!(J.info[name] && J.info[name].spell)) continue;
    const b = document.createElement('button'); b.textContent = J.info[name].label; b.dataset.spell = name; b.onclick = () => cast(name); $('#spells').appendChild(b);
  }
  $('#load').remove(); resize(); api.ready = true;
}).catch(e => { errBox.textContent += 'Could not load the model: ' + (e.message || e) + '\n'; });

function cast(name) {
  if (casting || !J) return;
  const a = J.mixer.clipAction(J.clips[name]);
  a.reset(); a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; a.setEffectiveWeight(0); a.play();
  casting = { name, a, w: 0, dur: J.clips[name].duration, hits: (HIT[name] || []).map(h => ({ at: J.info[name].release + h[0], s: h[1], q: h[2] || 0, done: false })) };
  $('#spells').classList.add('busy'); document.querySelectorAll('#spells button').forEach(b => b.classList.toggle('on', b.dataset.spell === name));
  hintOff();
}
function toggle(k) {
  state[k] = !state[k]; $('#bPixel').classList.toggle('on', state.pixel); $('#bVeil').classList.toggle('on', state.veil);
  if (J && J.veil) J.veil.visible = state.veil;
}
$('#bPixel').onclick = () => toggle('pixel'); $('#bVeil').onclick = () => toggle('veil');
let hinted = false; function hintOff() { if (!hinted) { hinted = true; $('#hint').style.opacity = 0; } }

// ---- controls: the pad walks her, dragging the picture turns the camera, the wheel or a pinch moves it in and out
{
  const pad = $('#pad'), knob = $('#knob'); let id = null;
  const set = e => { const r = pad.getBoundingClientRect(), R2 = r.width / 2; let x = (e.clientX - r.left - R2) / (R2 - 14), y = -(e.clientY - r.top - R2) / (R2 - 14); const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; } stick.x = x; stick.y = y; knob.style.transform = `translate(${x * (R2 - 26)}px,${-y * (R2 - 26)}px)`; };
  pad.addEventListener('pointerdown', e => { id = e.pointerId; pad.setPointerCapture(id); set(e); hintOff(); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === id) set(e); });
  const up = e => { if (e.pointerId === id) { id = null; stick.x = stick.y = 0; knob.style.transform = ''; } };
  pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up);
  const el = renderer.domElement, pts = new Map(); let pinch = 0;
  el.addEventListener('pointerdown', e => { pts.set(e.pointerId, [e.clientX, e.clientY]); el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); if (!p) return;
    if (pts.size === 1) { cam.yaw -= (e.clientX - p[0]) * 0.006; cam.pitch = Math.min(1.2, Math.max(-0.05, cam.pitch + (e.clientY - p[1]) * 0.005)); }
    p[0] = e.clientX; p[1] = e.clientY;
    if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) cam.dist = Math.min(14, Math.max(2.2, cam.dist * pinch / d)); pinch = d; }
  });
  const end = e => { pts.delete(e.pointerId); pinch = 0; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('wheel', e => { cam.dist = Math.min(14, Math.max(2.2, cam.dist * (1 + Math.sign(e.deltaY) * 0.1))); e.preventDefault(); }, { passive: false });
  addEventListener('keydown', e => { keys[e.code] = true; const n = '123456'.indexOf(e.key); if (n >= 0) { const b = document.querySelectorAll('#spells button')[n]; if (b) b.click(); } });
  addEventListener('keyup', e => { keys[e.code] = false; });
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setPixelRatio(pixelRatio); renderer.setSize(w, h, false); pipe.setSize(w, h, pixelRatio);
  camera.aspect = w / h; camera.fov = w < h ? 58 : 44;
  camera.setViewOffset(w, h, 0, Math.round(h * (w < h ? 0.10 : 0.04)), w, h);        // lift the picture clear of the controls
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const turn = (from, to, k) => from + Math.atan2(Math.sin(to - from), Math.cos(to - from)) * k;
const clock = new THREE.Clock(); let T = 0;
function frame(dtOverride, skipDraw) {
  const dt = dtOverride !== undefined ? dtOverride : Math.min(clock.getDelta(), 0.05);
  T += dt; dim = 0; let shake = 0;
  flies(T);
  if (J) {
    // where she wants to go
    let sx = stick.x, sy = stick.y;
    const kx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0), ky = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    if (kx || ky) { const m = Math.hypot(kx, ky), s = keys.ShiftLeft || keys.ShiftRight ? 0.5 : 1; sx = kx / m * s; sy = ky / m * s; hintOff(); }
    const mag = Math.min(1, Math.hypot(sx, sy));
    let want = casting ? 0 : (mag < 0.55 ? mag / 0.55 * 1.05 : 1.05 + (mag - 0.55) / 0.45 * 1.55);
    if (mag < 0.08) want = 0;
    me.v += (want - me.v) * Math.min(1, dt * 7);
    if (want > 0) {
      const fxv = -Math.sin(cam.yaw), fzv = -Math.cos(cam.yaw), dx = (sx * -fzv + sy * fxv) / mag, dz = (sx * fxv + sy * fzv) / mag;
      me.yaw = turn(me.yaw, Math.atan2(dx, dz), Math.min(1, dt * 9));
    }
    me.x += Math.sin(me.yaw) * me.v * dt; me.z += Math.cos(me.yaw) * me.v * dt;
    const r = Math.hypot(me.x, me.z); if (r > R - 0.9) { me.x *= (R - 0.9) / r; me.z *= (R - 0.9) / r; }
    const ddx = me.x - DUMMY.x, ddz = me.z - DUMMY.z, dd = Math.hypot(ddx, ddz); if (dd < 0.95) { me.x = DUMMY.x + ddx / dd * 0.95; me.z = DUMMY.z + ddz / dd * 0.95; }
    // which movement she plays
    let cw = 0;
    if (casting) {
      const c = casting, left = c.dur - c.a.time;
      c.w += ((left < 0.28 ? 0 : 1) - c.w) * Math.min(1, dt * 9); cw = c.w;
      me.yaw = turn(me.yaw, Math.atan2(DUMMY.x - me.x, DUMMY.z - me.z), Math.min(1, dt * 6));
      c.a.setEffectiveWeight(cw);
    }
    const wRun = cl((me.v - 1.3) / 0.9), wMove = cl(me.v / 0.35);
    loco.idle.setEffectiveWeight((1 - wMove) * (1 - cw)); loco.walk.setEffectiveWeight(wMove * (1 - wRun) * (1 - cw)); loco.run.setEffectiveWeight(wMove * wRun * (1 - cw));
    loco.walk.timeScale = cl(me.v / 0.93, 0.7, 1.7); loco.run.timeScale = cl(me.v / 2.58, 0.75, 1.15);
    J.mixer.update(dt); if (!TEST) blink(dt);
    J.root.position.set(me.x, 0, me.z); J.root.rotation.y = me.yaw; J.root.updateMatrixWorld(true);
    blob.position.x = me.x; blob.position.z = me.z;
    // her spell
    fx.F.begin(camera);
    const tgt = new THREE.Vector3(DUMMY.x, 1.2, DUMMY.z);
    if (casting) {
      const c = casting, t = c.a.time, x = ctx(c.name, c.a, tgt);
      fx.SPELLS[c.name](t, x); dim = x.out.dim; shake = x.out.shake;
      for (const h of c.hits) if (!h.done && t >= h.at) { h.done = true; const dx = DUMMY.x - me.x, dz = DUMMY.z - me.z, d = Math.hypot(dx, dz) || 1; kick(dx / d, dz / d, h.s, h.q); }
      if (c.dur - t < 0.02 || !c.a.isRunning()) { c.a.stop(); casting = null; $('#spells').classList.remove('busy'); document.querySelectorAll('#spells button').forEach(b => b.classList.remove('on')); }
    }
    // the dummy rocks on its post when it is hit
    wob.vx += (-wob.x * 60 - wob.vx * 5) * dt; wob.vz += (-wob.z * 60 - wob.vz * 5) * dt; wob.x += wob.vx * dt; wob.z += wob.vz * dt; wob.squash *= Math.exp(-dt * 6);
    dummy.rotation.set(cl(wob.x, -0.7, 0.7), Math.PI, cl(wob.z, -0.7, 0.7)); dummy.scale.set(1 + 0.25 * wob.squash, 1 - 0.45 * wob.squash, 1 + 0.25 * wob.squash);
    // the camera follows her, and steps back to take in a big spell
    const wide = casting ? WIDE[casting.name] || 1.5 : 0, aim = new THREE.Vector3(me.x, 1.2, me.z);
    if (casting && !['CurtainCall', 'AgainstAllOdds'].includes(casting.name)) aim.lerp(tgt, 0.42);
    if (casting && wide > 2.5) aim.y += 0.5;
    cam.focus.lerp(aim, Math.min(1, dt * 4)); cam.d += (cam.dist + wide - cam.d) * Math.min(1, dt * 2.5);
  }
  light(false);
  const cp = Math.cos(cam.pitch);
  camera.position.set(cam.focus.x + cam.d * Math.sin(cam.yaw) * cp, Math.max(0.25, cam.focus.y + cam.d * Math.sin(cam.pitch)), cam.focus.z + cam.d * Math.cos(cam.yaw) * cp);
  if (shake > 0 && !TEST) camera.position.add(new THREE.Vector3((Math.random() - 0.5), (Math.random() - 0.5), (Math.random() - 0.5)).multiplyScalar(0.14 * shake));
  camera.lookAt(cam.focus);
  if (!skipDraw) pipe.render(camera, state.pixel);
}
renderer.setAnimationLoop(() => { if (!TEST) frame(); });

// hooks for automated checks
const api = window.J = {
  ready: false, state, cast, toggle, frame, cam, me, stick,
  run(seconds, dt = 1 / 30) { for (let t = 0; t < seconds - 1e-6; t += dt) frame(dt, true); frame(0); },
  busy: () => !!casting, spellNames: () => [...document.querySelectorAll('#spells button')].map(b => b.dataset.spell), errors: () => errBox.textContent,
};
</script>
</body>
</html>
